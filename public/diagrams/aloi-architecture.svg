<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 400" role="img" aria-label="Aloi architecture: the terminal UI drives the agent loop, which talks to models through the ModelClient protocol and to tools through the Tool type; tools reach market data through the DataProvider protocol and public sources over HTTP; the figure check compares answers with tool results">
<style>
.h{font:500 9px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.14em;fill:#5f5f6a}
.t{font:600 11px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.04em;fill:#26262d;text-anchor:middle}
.s{font:400 8.5px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.03em;fill:#5f5f6a;text-anchor:middle}
.b{fill:#fff;stroke:#55555f;stroke-width:1}
.a{fill:none;stroke:#55555f;stroke-width:1}
.z{fill:none;stroke:#55555f;stroke-width:.8;stroke-dasharray:3 3}
</style>
<text class="h" x="16" y="18">ALOI — TWO PROTOCOLS ARE THE SEAMS: A NEW MODEL OR DATA SOURCE IS ONE ADAPTER</text>

<rect class="b" x="16" y="36" width="916" height="44" rx="3"/><text class="t" x="474" y="55">CLI · TERMINAL UI</text><text class="s" x="474" y="69">prompt, slash commands, renders the event stream</text>
<line class="a" x1="440" y1="80" x2="440" y2="105"/><path class="a" d="M436.5 105 L440 112 L443.5 105"/><text class="s" x="432" y="100" style="text-anchor:end">question</text>
<line class="a" x1="508" y1="112" x2="508" y2="87"/><path class="a" d="M504.5 87 L508 80 L511.5 87"/><text class="s" x="516" y="100" style="text-anchor:start">typed events</text>

<rect class="b" x="16" y="112" width="220" height="56" rx="3"/><text class="t" x="126" y="136">PROMPTS</text><text class="s" x="126" y="150">system prompt built from the tool set</text>
<line class="a" x1="236" y1="140" x2="339" y2="140"/><path class="a" d="M339 136.5 L346 140 L339 143.5"/><text class="s" x="291" y="132">prompt</text>
<rect x="346" y="112" width="256" height="56" rx="3" fill="#003c33"/><text class="t" x="474" y="136" style="fill:#fff">AGENT LOOP</text><text class="s" x="474" y="150" style="fill:#ffad9b">history budget · corrections · usage</text>
<line class="a" x1="602" y1="140" x2="705" y2="140"/><path class="a" d="M705 136.5 L712 140 L705 143.5"/><text class="s" x="657" y="132">answer, sources</text>
<rect class="b" x="712" y="112" width="220" height="56" rx="3" stroke-width="1.6"/><rect x="715" y="115" width="214" height="50" rx="2" fill="none" stroke="#55555f" stroke-width=".5" stroke-dasharray="2 3"/><text class="t" x="822" y="136">FIGURE CHECK</text><text class="s" x="822" y="150">answer vs fetched numbers</text>

<line class="a" x1="400" y1="175" x2="400" y2="207"/><path class="a" d="M396.5 175 L400 168 L403.5 175"/><path class="a" d="M396.5 207 L400 214 L403.5 207"/>
<text class="s" x="390" y="188" style="text-anchor:end">messages, tool specs ↓</text><text class="s" x="390" y="200" style="text-anchor:end">↑ text, tool calls</text>
<line class="a" x1="548" y1="175" x2="548" y2="207"/><path class="a" d="M544.5 175 L548 168 L551.5 175"/><path class="a" d="M544.5 207 L548 214 L551.5 207"/>
<text class="s" x="558" y="188" style="text-anchor:start">↓ validated call</text><text class="s" x="558" y="200" style="text-anchor:start">JSON result, chart ↑</text>

<rect class="z" x="16" y="214" width="436" height="92" rx="3"/><text class="h" x="28" y="233">MODELCLIENT PROTOCOL · STREAM(MESSAGES, TOOLS)</text>
<rect class="b" x="28" y="246" width="128" height="46" rx="3"/><text class="t" x="92" y="266">ANTHROPIC</text><text class="s" x="92" y="280">Claude API</text>
<rect class="b" x="170" y="246" width="128" height="46" rx="3"/><text class="t" x="234" y="266">OLLAMA</text><text class="s" x="234" y="280">local models</text>
<rect class="b" x="312" y="246" width="128" height="46" rx="3"/><text class="t" x="376" y="266">ENDPOINT</text><text class="s" x="376" y="280">OpenAI-compatible</text>

<rect class="z" x="496" y="214" width="436" height="92" rx="3"/><text class="h" x="508" y="233">TOOL · TYPED ARGS · RUN() → DATA, SUMMARY, CHART</text>
<rect class="b" x="508" y="246" width="128" height="46" rx="3"/><text class="t" x="572" y="266">48 TOOLS</text><text class="s" x="572" y="280">fetch · compute</text>
<rect class="b" x="650" y="246" width="128" height="46" rx="3"/><text class="t" x="714" y="266">17 SKILLS</text><text class="s" x="714" y="280">playbooks</text>
<rect class="b" x="792" y="246" width="128" height="46" rx="3"/><text class="t" x="856" y="266">CHARTS</text><text class="s" x="856" y="280">drawn in code</text>

<line class="a" x1="601" y1="306" x2="601" y2="333"/><path class="a" d="M597.5 333 L601 340 L604.5 333"/><text class="s" x="609" y="326" style="text-anchor:start">quotes, history, fields</text>
<line class="a" x1="827" y1="306" x2="827" y2="333"/><path class="a" d="M823.5 333 L827 340 L830.5 333"/><text class="s" x="835" y="326" style="text-anchor:start">HTTP</text>
<rect class="b" x="496" y="340" width="210" height="44" rx="3"/><text class="t" x="601" y="359">DATAPROVIDER PROTOCOL</text><text class="s" x="601" y="373">Yahoo · Bloomberg Terminal</text>
<rect class="b" x="722" y="340" width="210" height="44" rx="3"/><text class="t" x="827" y="359">PUBLIC SOURCES</text><text class="s" x="827" y="373">FRED · SEC · crypto · news, cached</text>

<text class="s" x="16" y="359" style="text-anchor:start">Adapters translate every backend to the same few types,</text>
<text class="s" x="16" y="371" style="text-anchor:start">so the loop, the tools and the checks are written once.</text>
</svg>
