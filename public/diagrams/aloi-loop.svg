<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 676" role="img" aria-label="One turn of the Aloi agent loop: build the context, stream the model, run any tool calls and loop; a reply without tool calls passes two guards that can each send one correction; then the held text is shown, the final figure check runs and the turn is saved">
<style>
.h{font:500 10px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.12em;fill:#5f5f6a}
.t{font:600 13px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.04em;fill:#1d1d23;text-anchor:middle}
.s{font:400 10.5px ui-monospace,'IBM Plex Mono',Consolas,monospace;letter-spacing:.03em;fill:#4f4f5c;text-anchor:middle}
.b{fill:#fff;stroke:#44444e;stroke-width:1.2}
.a{fill:none;stroke:#44444e;stroke-width:1.2}
.c{fill:none;stroke:#e0502f;stroke-width:1.4}
</style>
<text class="h" x="16" y="20">ONE TURN OF THE LOOP — CODE DECIDES WHAT RUNS AND WHAT IS SHOWN</text>

<rect class="b" x="280" y="40" width="256" height="56" rx="4"/><text class="t" x="408" y="64">BUILD THE CONTEXT</text><text class="s" x="408" y="82">system · budgeted history · this turn</text>
<line class="a" x1="408" y1="96" x2="408" y2="112"/><path class="a" d="M404 112 L408 120 L412 112"/>

<rect class="b" x="280" y="120" width="256" height="56" rx="4"/><text class="t" x="408" y="144">THE MODEL STREAMS</text><text class="s" x="408" y="162">last step: no tools, it must answer</text>
<text class="s" x="548" y="141" style="text-anchor:start">text before the first tool call</text>
<text class="s" x="548" y="157" style="text-anchor:start">is held until the guards pass</text>
<line class="a" x1="408" y1="176" x2="408" y2="192"/><path class="a" d="M404 192 L408 200 L412 192"/>

<rect class="b" x="280" y="200" width="256" height="44" rx="22"/><text class="t" x="408" y="227">TOOL CALLS IN THE REPLY?</text>
<polyline class="a" points="280,222 132,222 132,262"/><path class="a" d="M128 262 L132 270 L136 262"/><text class="s" x="206" y="214">yes</text>
<line class="a" x1="408" y1="244" x2="408" y2="272"/><path class="a" d="M404 272 L408 280 L412 272"/><text class="s" x="418" y="266" style="text-anchor:start">no</text>

<rect x="16" y="270" width="232" height="118" rx="4" fill="#003c33"/><text class="t" x="132" y="294" style="fill:#fff">FOR EACH TOOL CALL</text>
<text class="s" x="30" y="318" style="text-anchor:start;fill:#d6e9e4">1  validate the arguments</text>
<text class="s" x="30" y="336" style="text-anchor:start;fill:#ffad9b">2  refuse numbers never fetched</text>
<text class="s" x="30" y="354" style="text-anchor:start;fill:#d6e9e4">3  run · errors return as text</text>
<text class="s" x="30" y="372" style="text-anchor:start;fill:#d6e9e4">4  JSON, cut at 16K or 4K chars</text>
<polyline class="a" points="80,270 80,68 272,68"/><path class="a" d="M272 64 L280 68 L272 72"/>
<text class="s" x="90" y="150" style="text-anchor:start">results appended,</text><text class="s" x="90" y="166" style="text-anchor:start">next step</text>

<rect class="b" x="280" y="280" width="256" height="60" rx="30"/><text class="t" x="408" y="306">ANSWERED WITHOUT A FETCH?</text><text class="s" x="408" y="324">and 2+ figures with no source</text>
<line class="c" x1="536" y1="310" x2="564" y2="310"/><path class="c" d="M564 306 L572 310 L564 314"/><text class="s" x="552" y="302" style="fill:#c2391b">yes</text>
<rect x="572" y="280" width="208" height="60" rx="4" fill="#fff" stroke="#e0502f" stroke-width="1.4"/><text class="t" x="676" y="306">CORRECTION: FETCH FIRST</text><text class="s" x="676" y="324">draft discarded, never shown</text>
<line class="a" x1="408" y1="340" x2="408" y2="362"/><path class="a" d="M404 362 L408 370 L412 362"/><text class="s" x="418" y="358" style="text-anchor:start">no</text>

<rect class="b" x="280" y="370" width="256" height="60" rx="30"/><text class="t" x="408" y="396">CHART ASKED FOR, NOT DRAWN?</text><text class="s" x="408" y="414">matched on the user's words</text>
<line class="c" x1="536" y1="400" x2="564" y2="400"/><path class="c" d="M564 396 L572 400 L564 404"/><text class="s" x="552" y="392" style="fill:#c2391b">yes</text>
<rect x="572" y="370" width="208" height="60" rx="4" fill="#fff" stroke="#e0502f" stroke-width="1.4"/><text class="t" x="676" y="396">CORRECTION: DRAW IT</text><text class="s" x="676" y="414">each correction once per turn</text>
<line class="c" x1="780" y1="310" x2="792" y2="310"/>
<polyline class="c" points="780,400 792,400 792,68 544,68"/><path class="c" d="M544 64 L536 68 L544 72"/>
<text class="s" x="784" y="58" style="text-anchor:end;fill:#c2391b">sent back as a user message</text>
<line class="a" x1="408" y1="430" x2="408" y2="452"/><path class="a" d="M404 452 L408 460 L412 452"/><text class="s" x="418" y="448" style="text-anchor:start">no</text>

<rect class="b" x="280" y="460" width="256" height="44" rx="4"/><text class="t" x="408" y="487">THE HELD TEXT IS SHOWN</text>
<line class="a" x1="408" y1="504" x2="408" y2="522"/><path class="a" d="M404 522 L408 530 L412 522"/>

<rect class="b" x="280" y="530" width="256" height="60" rx="4" stroke-width="2"/><rect x="284" y="534" width="248" height="52" rx="2" fill="none" stroke="#44444e" stroke-width=".6" stroke-dasharray="2 3"/><text class="t" x="408" y="556">FINAL FIGURE CHECK</text><text class="s" x="408" y="574">a flag for the reader, no retry</text>
<text class="s" x="548" y="551" style="text-anchor:start">after a fetch, a figure with no</text>
<text class="s" x="548" y="567" style="text-anchor:start">source is reported and the answer</text>
<text class="s" x="548" y="583" style="text-anchor:start">stands; a retry is undecided</text>
<line class="a" x1="408" y1="590" x2="408" y2="608"/><path class="a" d="M404 608 L408 616 L412 608"/>

<rect class="b" x="280" y="616" width="256" height="44" rx="4"/><text class="t" x="408" y="643">TURN SAVED · USAGE LINE</text>
</svg>
